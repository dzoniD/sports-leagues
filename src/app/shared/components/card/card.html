<div class="card-header">
  <h3>{{ league()?.strLeague }}</h3>
</div>
<div class="card-body">
  <div class="card-row">
    <span class="label">Sport:</span>
    <span class="value">{{ league()?.strSport }}</span>
  </div>
  <div class="card-row">
    <span class="label">Alternate Name:</span>
    <span class="value">{{ league()?.strLeagueAlternate || 'N/A' }}</span>
  </div>
</div>
